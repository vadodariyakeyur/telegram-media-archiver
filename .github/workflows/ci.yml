name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Structural checks the suites cannot cover: naming drift across
  # wxt.config/package.json/README, icon pixel sizes, side-panel assets. These
  # only surface when Chrome loads the extension, so CI is the last place to
  # catch them.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm before setup-node: `cache: pnpm` needs the binary to resolve the
      # store path, and version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # --frozen-lockfile is the point of committing pnpm-lock.yaml: CI must
      # install what was tested, not re-resolve a newer tree.
      #
      # The postinstall (`wxt prepare`) is what makes tsc work at all here.
      # tsconfig.json extends .wxt/tsconfig.json, which is generated and
      # gitignored — without it every compiler option falls back to ES5
      # defaults and the run drowns in cascading errors.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Gated on both, so a downloadable artifact always came from a green run.
  build:
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `zip`, not `build`: wxt build only writes .output/chrome-mv3/, so an
      # artifact step pointed at a zip would fail on a perfectly good build.
      - run: pnpm zip
      # .output is a DOTTED directory, and @actions/glob skips hidden paths by
      # default — the upload finds nothing even though wxt zip just wrote the
      # file to exactly this path, and reports it as a missing-file error.
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: .output/*.zip
          if-no-files-found: error
          include-hidden-files: true
